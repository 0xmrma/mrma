[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrma"
version = "0.3.0"
description = "Evidence-driven HTTP trust-boundary experimentation for authorized security research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "tomli>=2.0; python_version < '3.11'",
]

authors = [
  { name = "Mohamed Abdelaal (0xmrma)", email = "moabdelaal442004@gmail.com" }
]

keywords = ["security", "http", "trust-boundary", "differential-testing", "research", "cli"]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/0xmrma/mrma"
Repository = "https://github.com/0xmrma/mrma"
Issues = "https://github.com/0xmrma/mrma/issues"
[project.scripts]
mrma = "mrma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrma*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
