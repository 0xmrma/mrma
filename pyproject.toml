[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrma"
version = "0.3.4"
description = "Evidence-driven HTTP trust-boundary experimentation for authorized security research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<16",
  "tomli>=2.4.1; python_version < '3.11'",
]

authors = [
  { name = "Mohamed Abdelaal (0xmrma)", email = "moabdelaal442004@gmail.com" }
]

keywords = ["security", "http", "trust-boundary", "differential-testing", "research", "cli"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/0xmrma/mrma"
Repository = "https://github.com/0xmrma/mrma"
Issues = "https://github.com/0xmrma/mrma/issues"
[project.scripts]
mrma = "mrma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mrma*"]

[tool.setuptools.package-data]
mrma = ["schemas/*.json"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "jsonschema>=4.22",
  "mypy>=1.11",
  "packaging>=24.0",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
